<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta name="description" content="A simple, welcoming Hello World homepage." />
    <link rel="icon" href="data:," />
    <title>Hello, world!</title>
    <style>
      * { box-sizing: border-box; }
      body {
        isolation: isolate;
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #f5f7fb;
        color: #17233b;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: 100%;
        max-width: 44rem;
        padding: clamp(1.5rem, 6vw, 4rem);
        border: 1px solid #dce3ef;
        border-radius: 1.5rem;
        background: #fff;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 1.15;
        letter-spacing: -0.04em;
        overflow-wrap: anywhere;
      }
      p { margin: 1rem 0 0; color: #52617a; line-height: 1.6; }
      .ball-background { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; }
      .ball {
        --size: clamp(5rem, 18vw, 12rem);
        position: absolute;
        top: 0;
        left: 12%;
        width: var(--size);
        height: var(--size);
        border-radius: 50%;
        background: radial-gradient(circle at 30% 25%, #dbeafe, #93b4e8 65%, #789bd2);
        animation: bounce 12s ease-in-out infinite alternate;
      }
      @keyframes bounce {
        from { transform: translateY(0); }
        to { transform: translateY(calc(100svh - var(--size))); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ball { animation: none; top: 12%; }
      }
    </style>
  </head>
  <body>
    <div class="ball-background" aria-hidden="true"><div class="ball"></div></div>
    <main>
      <h1>Hello, world!</h1>
      <p>A little hello. A world of possibilities.</p>
    </main>
  </body>
</html>
